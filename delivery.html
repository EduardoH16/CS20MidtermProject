<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>delivery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
        <div class="wrapper">
            <header>
                <nav>
                    <div class="menuButtons">
                        <a href="index.html">Home</a>
                        <a href="find-an-influencer.html">Menu</a>
                        <a href="stories.html">Delivery</a>
                        <a href="contact.html">Contact Us</a>
                    </div>
                </nav>
            </header>
            <h2 id="titleCard">Delivery</h2>

            <form action="#">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name">
                <br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email">
                <br>

                <label for="message">Address:</label>
                <textarea id="message" name="message"></textarea>
                <br>

                <label for="options">Select a product:</label>
                <select name="options" id="options">
                    <option value="Apple Cider Donut">Apple Cider Donut - $3.75</option>
                    <option value="Maple Pecan">Maple Pecan - $4.25</option>
                    <option value="Pumpkin Spice Cake">Pumpkin Spice Cake - $3.75</option>
                    <option value="Classic Glazed">Classic Glazed - $2.75</option>
                    <option value="Chocolate Frosted">Chocolate Frosted - $3.25</option>
                    <option value="Old-Fashioned Sour Cream">Old-Fashioned Sour Cream - $3.00</option>
                    <option value="Raspberry Jam">Raspberry Jam - $3.75</option>
                    <option value="Vanilla Custard">Vanilla Custard - $4.00</option>
                    <option value="Lemon Curd">Lemon Curd - $4.00</option>
                    <option value="Drip Coffee">Drip Coffee - $2.50</option>
                    <option value="Hot Mulled Cider">Hot Mulled Cider - $3.50</option>
                </select>
                

                <button type="submit">Place Order</button>
            </form>


        </div>
    


    <footer>
        <h2>Check out our socials:</h2>
        <button class="facebook"></button>
        <button class="twitter"></button>
        <button class="instagram"></button>
    </footer>

    <style>
                
        form {
            display: flex;
            flex-direction: column;
            width: 500px;
            margin: 40px auto;
            padding: 30px;
            background-color: var(--smoky-rose);
            border-radius: 10px;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            margin-bottom: 175px;
        }

        form label {
            color: var(--off-white);
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            font-size: 18px;
            margin-bottom: 5px;
        }

        form input,
        form select,
        form textarea {
            margin-bottom: 20px;
            padding: 10px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
        }

        form button {
            background-color: var(--stone-brown);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 18px;
            cursor: pointer;
        }

        form button:hover {
            background-color: #6fa58c;
        }

    </style>

    


    
    
</body>


</html>
